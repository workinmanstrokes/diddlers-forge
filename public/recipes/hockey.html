const RK = { l: 22, r: 338, t: 76, b: 624, c: 58 }, GT = 126, GB = 574, MOUTH = 28;

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function release(p, vx, vy) { puck.owner = null; puck.x = p.x + Math.cos(p.face) * 15; puck.y = p.y + Math.sin(p.face) * 15; puck.vx = vx; puck.vy = vy; puck.noPick = p; puck.noPickT = 0.22; puck.lastTeam = p.team; }
function pass(g, p) {

  from.stun = 0.7; g.particles(from.x, from.y, { color: ['#fff', CFG.accent], n: 10, speed: 140 }); g.sfx('hit'); g.shake(5);

}

  if (team === 0) { g.addScore(100, 180, GT + 30); g.banner('GOAL!', CFG.homeName + ' ' + goals[0] + ' – ' + goals[1] + ' ' + CFG.awayName); g.sfx('win'); g.flash(CFG.homeColor, 0.35); g.particles(180, GT, { color: [CFG.homeColor, '#fff', '#fde047'], n: 60, speed: 300 }); }

}

const GAME = {

  init(g) {

    puck = { trail: [] }; goals = [0, 0]; period = 1; clock = CFG.periodSeconds; ot = false; switchT = 0; stick = null;
    if (!scratches) { scratches = []; for (let k = 0; k < 40; k++) scratches.push([g.rand(40, 320), g.rand(100, 600), g.rand(-1, 1), g.rand(10, 30)]); }
    if (!g.data.btn) { g.data.btn = 1; g.buttons([{ id: 'shoot', label: 'SHOOT', icon: '🏒', key: ['z', 'Enter', 'k'], color: CFG.awayColor }, { id: 'pass', label: 'PASS', icon: '↗️', key: ['x', ' ', 'j'], color: CFG.homeColor }]); }
    faceoff(g);
  },
  update(g, dt) {

    if (phase === 'goal' || phase === 'break') { phaseT -= dt; if (phaseT <= 0 && !(ot && phase === 'goal')) faceoff(g); }
    if (phase === 'play' && !ot) {

        else if (goals[0] === goals[1]) { ot = true; phase = 'break'; phaseT = 2; g.banner('OVERTIME', 'Next goal wins!'); g.sfx('power'); }

        if (puck.owner === p) {

        } else if (inp.buttonPressed('pass')) { const o = sk.filter((q) => q.team === 0 && q !== me).reduce((a, b) => (dist(b, puck) < dist(a, puck) ? b : a)); me = o; switchT = g.t + 0.6; g.sfx('tick'); }
      } else ai(g, p, dt);
      if (p.stun <= 0 && live && p !== me && Math.hypot(p.vx, p.vy) > 20) p.face = Math.atan2(p.vy, p.vx);

      if (o > 0) {
        a.x -= dx / d * o / 2; a.y -= dy / d * o / 2; b.x += dx / d * o / 2; b.y += dy / d * o / 2;
        if (live && a.team !== b.team) for (const [h, v] of [[a, b], [b, a]]) if (h.dash > 0 && puck.owner === v && v.stun <= 0) { steal(g, v, h); g.floatText(v.x, v.y - 24, 'CHECK!', '#fff', 18); }

      const tx = g.clamp(puck.x + lead * 0.8, 180 - MOUTH + 8, 180 + MOUTH - 8);

    g.rect(RK.l, 348, RK.r - RK.l, 5, CFG.redLine); g.ring(180, 350, 42, CFG.blueLine, 2.5); g.circle(180, 350, 4, CFG.blueLine);
    for (const y of [262, 438]) g.rect(RK.l, y - 3, RK.r - RK.l, 6, CFG.blueLine);

      ctx.strokeStyle = 'rgba(100,116,139,.6)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let x = 180 - MOUTH; x <= 180 + MOUTH; x += 7) { ctx.moveTo(x, y0); ctx.lineTo(x, y0 + 20); } for (let y = y0 + 5; y < y0 + 20; y += 5) { ctx.moveTo(180 - MOUTH - 4, y); ctx.lineTo(180 + MOUTH + 4, y); } ctx.stroke();
