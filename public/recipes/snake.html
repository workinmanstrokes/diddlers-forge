<!-- app: {"name":"Snake Arena","emoji":"🐍","color":"#34d399","type":"game","orientation":"portrait"} -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snake Arena</title>
<script src="kit/game.js"></script>
</head>
<body>
<script>
// TUNING — change these first: names, colors, emoji, speeds, difficulty
const CFG = {
  "title": "Snake Arena",
  "emoji": "🐍",
  "help": "Swipe or use the arrow keys to steer. Eat orbs, grow long, don't bite yourself or a rock!",
  "accent": "#34d399",
  "bgTop": "#04130f",
  "bgBottom": "#0b2a22",
  "boardColor": "#0a1f19",
  "snakeHead": "#6ee7b7",
  "snakeTail": "#047857",
  "orbColor": "#f472b6",
  "goldColor": "#facc15",
  "rock": "🪨",
  "music": "chill",
  "cols": 13,
  "rows": 20,
  "orbs": 3,
  "startSpeed": 6,
  "maxSpeed": 14,
  "speedUpEvery": 4,
  "wrapWalls": true,
  "rockEvery": 3,
  "goldChance": 0.15,
  "orbPoints": 10,
  "goldPoints": 50
};

// GAME
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let C, OX, OY, snake, prev, dir, queue, orbs, rocks, stepT, sp, eaten, moving, acc, grow, dead;

function free(g, avoidHead) {
  for (let n = 0; n < 400; n++) {
    const x = g.randi(0, CFG.cols - 1), y = g.randi(0, CFG.rows - 1);
    if (snake.some((s) => s.x === x && s.y === y) || rocks.some((r) => r.x === x && r.y === y) || orbs.some((o) => o.x === x && o.y === y)) continue;
    if (avoidHead && Math.abs(x - snake[0].x) + Math.abs(y - snake[0].y) < 5) continue;
    return { x, y };
  }
  return null;
}
function placeOrb(g, at) { const p = at || free(g); if (p) orbs.push({ ...p, gold: !at && g.chance(CFG.goldChance), t: 0 }); }
function ahead(g) {
  const h = snake[0], d = DIRS[dir], n = d[0] ? CFG.cols : CFG.rows;
  for (let k = 0; k < 12; k++) {
    const st = g.randi(3, Math.max(3, n - 2)), x = (h.x + d[0] * st + CFG.cols * 4) % CFG.cols, y = (h.y + d[1] * st + CFG.rows * 4) % CFG.rows;
    if (!snake.some((s) => s.x === x && s.y === y) && !rocks.some((r) => r.x === x && r.y === y) && !orbs.some((o) => o.x === x && o.y === y)) return { x, y };
  }
  return null;
}
function turn(d) {
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (d === last || (DIRS[d][0] === -DIRS[last][0] && DIRS[d][1] === -DIRS[last][1])) return;
  if (queue.length < 2) queue.push(d);
  if (!moving) { moving = true; const h = snake[0], ax = (h.x + DIRS[d][0] * 2 + CFG.cols) % CFG.cols, ay = (h.y + DIRS[d][1] * 2 + CFG.rows) % CFG.rows; if (!orbs.some((o) => o.x === ax && o.y === ay)) placeOrb(null, { x: ax, y: ay }); }
}
function cell(p) { return { x: OX + p.x * C + C / 2, y: OY + p.y * C + C / 2 }; }

Kit.game({
  title: CFG.title, emoji: CFG.emoji, help: CFG.help, color: CFG.accent, bg: CFG.bgTop, music: CFG.music,
  init(g) {
    C = Math.min(340 / CFG.cols, 540 / CFG.rows); OX = (360 - C * CFG.cols) / 2; OY = 82 + (548 - C * CFG.rows) / 2;
    const cx = Math.floor(CFG.cols / 2), cy = Math.floor(CFG.rows * 0.65);
    snake = [{ x: cx, y: cy }, { x: cx, y: cy + 1 }, { x: cx, y: cy + 2 }]; prev = snake.map((s) => ({ ...s }));
    dir = 'up'; queue = []; rocks = []; orbs = []; stepT = 0; sp = CFG.startSpeed; eaten = 0; moving = false; acc = { x: 0, y: 0 }; grow = 0; dead = false;
    for (let k = 0; k < Math.max(1, CFG.orbs - 1); k++) placeOrb(g);
  },
  update(g, dt) {
    const inp = g.input;
    if (inp.swipe) turn(inp.swipe);
    for (const k of ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd']) if (inp.keyPressed(k)) turn({ ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right' }[k]);
    if (inp.down) {
      acc.x += inp.dragX; acc.y += inp.dragY;
      if (Math.abs(acc.x) > 22 && Math.abs(acc.x) > Math.abs(acc.y)) { turn(acc.x > 0 ? 'right' : 'left'); acc = { x: 0, y: 0 }; }
      else if (Math.abs(acc.y) > 22) { turn(acc.y > 0 ? 'down' : 'up'); acc = { x: 0, y: 0 }; }
    } else acc = { x: 0, y: 0 };
    for (const o of orbs) o.t += dt;
    if (!moving || dead) return;

    stepT += dt * sp;
    while (stepT >= 1) {
      stepT -= 1; if (queue.length) dir = queue.shift();
      const old = snake.map((s) => ({ ...s }));
      const h = snake[0]; let nx = h.x + DIRS[dir][0], ny = h.y + DIRS[dir][1];
      if (CFG.wrapWalls) { nx = (nx + CFG.cols) % CFG.cols; ny = (ny + CFG.rows) % CFG.rows; }
      const tailMoves = grow === 0;
      const hitSelf = snake.some((s, i) => s.x === nx && s.y === ny && !(tailMoves && i === snake.length - 1));
      if (nx < 0 || ny < 0 || nx >= CFG.cols || ny >= CFG.rows || hitSelf || rocks.some((r) => r.x === nx && r.y === ny)) {
        dead = true; g.shake(14); g.flash('#ff3355', 0.35); g.sfx('explode');
        snake.forEach((s, i) => g.after(i * 0.03, () => { const p = cell(s); g.particles(p.x, p.y, { color: [CFG.snakeHead, CFG.snakeTail, '#fff'], n: 5, speed: 140 }); }));
        g.after(Math.min(1.2, snake.length * 0.03 + 0.3), () => g.over()); return;
      }
      snake.unshift({ x: nx, y: ny });
      if (grow > 0) grow--; else snake.pop();
      prev = old.slice(0, snake.length); while (prev.length < snake.length) prev.push({ ...old[old.length - 1] });
      const oi = orbs.findIndex((o) => o.x === nx && o.y === ny);
      if (oi >= 0) {
        const orb = orbs.splice(oi, 1)[0], p = cell(orb); eaten++; grow += orb.gold ? 3 : 1;
        g.addScore(orb.gold ? CFG.goldPoints : CFG.orbPoints, p.x, p.y - 14); g.sfx(orb.gold ? 'power' : 'coin'); g.vibrate(12);
        g.particles(p.x, p.y, { color: [orb.gold ? CFG.goldColor : CFG.orbColor, '#fff'], n: orb.gold ? 26 : 14, speed: 160 });
        if (eaten % CFG.speedUpEvery === 0 && sp < CFG.maxSpeed) { sp = Math.min(CFG.maxSpeed, sp + 1); g.floatText(180, 120, 'FASTER!', CFG.accent, 22); }
        if (CFG.rockEvery > 0 && eaten % CFG.rockEvery === 0) { const r = free(g, true); if (r) { rocks.push(r); const q = cell(r); g.particles(q.x, q.y, { color: '#a8a29e', n: 8, speed: 80 }); } }
        const a = ahead(g); if (a) placeOrb(g, a);
        while (orbs.length < CFG.orbs) placeOrb(g);
      }
    }
  },
  draw(g, ctx) {
    g.backdrop('bokeh', { colors: [CFG.bgTop, CFG.bgBottom], tint: [CFG.accent, CFG.orbColor], speed: 0.4, alpha: 0.6 });
    if (!snake) return;
    g.rect(OX - 6, OY - 6, C * CFG.cols + 12, C * CFG.rows + 12, CFG.boardColor, 14);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    for (let x = 0; x < CFG.cols; x++) for (let y = 0; y < CFG.rows; y++) if ((x + y) % 2) ctx.fillRect(OX + x * C, OY + y * C, C, C);
    for (const r of rocks) { const p = cell(r); g.emoji(CFG.rock, p.x, p.y, C * 0.95); }
    for (const orb of orbs) {
      const p = cell(orb), col = orb.gold ? CFG.goldColor : CFG.orbColor, pulse = 1 + Math.sin(orb.t * 6) * 0.12;
      ctx.globalCompositeOperation = 'lighter'; g.circle(p.x, p.y, C * 0.75 * pulse, col + '33'); ctx.globalCompositeOperation = 'source-over';
      g.circle(p.x, p.y, C * 0.34 * pulse, col); g.circle(p.x - C * 0.1, p.y - C * 0.1, C * 0.1, 'rgba(255,255,255,.8)');
    }
    const f = moving && !dead ? Math.min(1, stepT) : 1, n = snake.length;
    const pts = snake.map((s, i) => {
      const a = prev[i] || s, wrap = Math.abs(a.x - s.x) > 1 || Math.abs(a.y - s.y) > 1;
      const q = wrap ? s : { x: a.x + (s.x - a.x) * f, y: a.y + (s.y - a.y) * f }; return cell(q);
    });
    const lerpC = (t) => { const h = (c) => [1, 3, 5].map((k) => parseInt(c.slice(k, k + 2), 16)); const a = h(CFG.snakeHead), b = h(CFG.snakeTail); return 'rgb(' + a.map((v, k) => Math.round(v + (b[k] - v) * t)).join(',') + ')'; };
    for (let i = n - 1; i >= 0; i--) {
      const p = pts[i], r = C * (0.46 - 0.12 * (i / Math.max(1, n - 1)));
      if (i < n - 1 && Math.hypot(pts[i + 1].x - p.x, pts[i + 1].y - p.y) < C * 1.5) g.line(p.x, p.y, pts[i + 1].x, pts[i + 1].y, lerpC(i / n), r * 2);
      g.circle(p.x, p.y, r, dead ? '#64748b' : lerpC(i / n));
    }
    const h = pts[0], d = DIRS[dir], ex = -d[1], ey = d[0];
    for (const s of [-1, 1]) { g.circle(h.x + d[0] * C * 0.15 + ex * s * C * 0.2, h.y + d[1] * C * 0.15 + ey * s * C * 0.2, C * 0.12, '#fff'); g.circle(h.x + d[0] * C * 0.2 + ex * s * C * 0.2, h.y + d[1] * C * 0.2 + ey * s * C * 0.2, C * 0.06, '#052e16'); }
    if (!moving && g.state === 'play') { g.text('Swipe to start', 180, OY + C * CFG.rows * 0.35, { size: 22, color: '#fff', glow: CFG.accent }); g.text('👆', 180, OY + C * CFG.rows * 0.35 + 36, { size: 26 }); }
  },
});
</script>
</body>
</html>
