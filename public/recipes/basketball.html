<script>

const CFG = {

// GAME
const CT = { l: 22, r: 338, t: 80, b: 620 }, HT = { x: 180, y: 122 }, HB = { x: 180, y: 578 }, ARC = 140;

function give(g, p, reset) { if (reset || p.team !== ball.team || ball.afterShot) shot = CFG.shotClock; ball.owner = p; ball.mode = 'held'; ball.z = 0; ball.team = p.team; ball.afterShot = false; }

}
function shootBall(g, p) {

  const def = pl.filter((o) => o.team !== p.team).reduce((a, b) => (dist(b, p) < dist(a, p) ? b : a)), dd = dist(def, p);

function canSteal(g) { return !(ball.safe > g.t); }
function inFront(c, p) { const h = hoopOf(c.team); return (p.x - c.x) * (h.x - c.x) + (p.y - c.y) * (h.y - c.y) > 0; }
function steal(g, from, by) {
  release(from); ball.mode = 'loose'; ball.vx = (by.x - from.x) * 4 + g.rand(-50, 50); ball.vy = (by.y - from.y) * 4 + g.rand(-50, 50); ball.z = 10; ball.vz = 90;
  from.stun = 0.5; g.sfx('hit'); g.particles(from.x, from.y, { color: ['#fff', CFG.accent], n: 10, speed: 140 });

}

function end(g) { const a = pts[0], b = pts[1]; if (a > b) { g.addScore(500); GAME.winText = 'You win ' + a + '–' + b + '!'; g.win(); } else { GAME.overText = 'Lost ' + a + '–' + b; g.over(); } }
function steer(p, tx, ty, sp, dt) { const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy) || 1, s = sp * Math.min(1, d / 26); p.vx += (dx / d * s - p.vx) * Math.min(1, dt * 7); p.vy += (dy / d * s - p.vy) * Math.min(1, dt * 7); }

}
function block(g, p) { ball.mode = 'loose'; ball.vx = g.rand(-160, 160); ball.vy = (p.team === 0 ? -1 : 1) * -g.rand(60, 160); ball.vz = 160; ball.z = 30; g.sfx('hit'); g.shake(6); g.floatText(p.x, p.y - 40, 'BLOCKED!', '#fde047', 18); if (p.team === 0) g.addScore(50); }

const GAME = {
  title: CFG.title, emoji: CFG.emoji, help: CFG.help, color: CFG.accent, bg: CFG.arena, music: CFG.music, overEmoji: '🏀', winText: 'You win!',
  init(g) {

    me = pl[0]; give(g, pl[0], true); pl[0].x = 180; pl[0].y = 470; phase = 'inbound'; phaseT = 0.8;
    if (!g.data.btn) { g.data.btn = 1; g.buttons([{ id: 'shoot', label: 'SHOOT', icon: '🏀', key: ['z', 'Enter', 'k'], color: CFG.accent }, { id: 'pass', label: 'PASS', icon: '↗️', key: ['x', ' ', 'j'], color: CFG.homeColor }]); }
  },
  update(g, dt) {

    if (phase === 'inbound') { phaseT -= dt; if (phaseT <= 0) phase = 'play'; }

        p.vx += (inp.axis.x * sp - p.vx) * Math.min(1, dt * 8); p.vy += (inp.axis.y * sp - p.vy) * Math.min(1, dt * 8);
        const passIt = inp.buttonPressed('pass') || inp.tap, shootIt = inp.buttonPressed('shoot') || inp.swipe === 'up';

          if (c && c.team === 1 && dist(c, p) < 34 && canSteal(g)) { if (g.chance(inFront(c, p) ? 0.34 : 0.1)) steal(g, c, p); else { p.stun = 0.35; g.floatText(p.x, p.y - 30, 'reached!', '#ffffffaa', 14); } }

        } else if (inp.buttonPressed('pass') && !ball.owner) { const o = pl.filter((q) => q.team === 0 && q !== me).reduce((a, b) => (dist(b, ball) < dist(a, ball) ? b : a)); me = o; switchT = g.t + 0.6; }

  draw(g, ctx) {

      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1; ctx.beginPath(); for (let k = -2; k <= 2; k++) { ctx.moveTo(h.x + k * 4, h.y); ctx.lineTo(h.x + k * 2.6, h.y + dir * 12); } ctx.stroke();

      const r = p.r * (1 + j / 40); g.circle(p.x, p.y - j, r, p.stun > 0 ? '#94a3b8' : col); g.ring(p.x, p.y - j, r, trim, 2);

    g.text(CFG.homeName + '  ' + pts[0], 142, 39, { size: 15, weight: 900, color: '#fff' }); g.text(pts[1] + '  ' + CFG.awayName, 218, 39, { size: 15, weight: 900, color: '#fff' });
    g.text(mm + ':' + ss + '   ·   ⏱ ' + Math.ceil(shot) + '   ·   to ' + CFG.winScore, 180, 59, { size: 10.5, weight: 800, color: shot < 4 && ball.owner ? '#fca5a5' : '#ffffffcc' });
    if (stick && g.state === 'play') { g.ring(stick.x, stick.y, 34, 'rgba(0,0,0,.3)', 2); g.circle(stick.x + g.clamp(g.input.x - stick.x, -34, 34), stick.y + g.clamp(g.input.y - stick.y, -34, 34), 13, 'rgba(0,0,0,.25)'); }
  },
};
Kit.game(GAME);
</script>
